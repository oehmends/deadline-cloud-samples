{% set name = "3dsmax-2026-corona" %}
{% set version = "2026.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Plugin payload extracted under archive_files/3dsmax-3dstoC/win-64
  - path: ../../archive_files/3dsmax-3dstoC/win-64  # [win64]

build:
  skip: true  # [not win64]
  number: 0
  binary_relocation: false
  detect_binary_files_with_prefix: false
  missing_dso_whitelist:
    - "**"

requirements:
  run:
    - 3dsmax >=2026,<2027

about:
  home: https://corona-renderer.com/
  license: LicenseRef-CoronaEULA
  summary: Corona Renderer plug-in for Autodesk 3ds Max 2026.
